name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # tag 推送时创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 37 / build-tools / NDK / CMake)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1" platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # DA3-Base 模型 123MB 不入库（GitHub 单文件上限），构建时由
      # `fetchDa3BaseModel` 任务下载 + SHA-256 校验；这里做跨 run 缓存。
      - name: Cache DA3-Base model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/da3_base_int8.onnx
          key: da3-base-86dd3200ed25

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperExtreme-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 打 tag（如 v1.6.0）推送时自动建 Release 并附上 APK
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
